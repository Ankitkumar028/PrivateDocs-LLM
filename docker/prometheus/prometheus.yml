global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "privatedocs-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"

  - job_name: "vllm"
    static_configs:
      - targets: ["llm:8000", "vllm:8000", "host.docker.internal:8000"]
    metrics_path: "/metrics"
