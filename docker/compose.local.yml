services:
  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: privatedocs-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: privatedocs-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: privatedocs-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=local
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=llama3.2:1b
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - API_HOST=0.0.0.0
      - API_PORT=8000
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: docker/ui.Dockerfile
    container_name: privatedocs-ui
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: privatedocs-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.3
    container_name: privatedocs-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  qdrant_data:
  ollama_models:
